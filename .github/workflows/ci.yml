name: CI

on:
  pull_request:
  push:
    branches: [main, rn-0.83-upgrade]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a new push supersedes the in-flight run

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # This step IS blocking: it catches a broken lockfile or a patch-package
      # patch that no longer applies after a dependency bump.
      - name: Install dependencies
        run: npm ci

      # The three steps below are reporting-only for now. As of this commit:
      #   typecheck -> ~17 pre-existing errors (missing @types/lodash, @types/numeral,
      #                implicit-any index signatures)
      #   test      -> App.test.tsx fails: transformIgnorePatterns doesn't cover the
      #                RN deps, so ESM in node_modules is never transpiled
      #   lint      -> eslint 8 is installed but no .eslintrc exists anywhere
      # Fix each one, then drop its `continue-on-error` line to make it a real gate.
      - name: Typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Test
        continue-on-error: true
        run: npx jest --ci --passWithNoTests

      - name: Lint
        continue-on-error: true
        run: npm run lint
