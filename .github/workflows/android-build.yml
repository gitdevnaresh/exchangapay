name: Build Android APK

# Reusable build. Called by release.yml on a tag, or run by hand from the
# Actions tab. Deliberately NOT run on every push — a full new-arch native
# build takes ~30-45 min and would burn Actions minutes on every commit.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        default: release
        options: [release, debug]
      architectures:
        description: "ABIs to build (fewer = much faster)"
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a,arm64-v8a
          - armeabi-v7a,arm64-v8a,x86,x86_64
  workflow_call:
    inputs:
      build_type:
        type: string
        default: release
      architectures:
        type: string
        default: armeabi-v7a,arm64-v8a
    outputs:
      artifact_name:
        description: "Name of the uploaded APK artifact"
        value: ${{ jobs.build.outputs.artifact_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JS dependencies
        run: npm ci # postinstall runs patch-package for the 3 patched libs

      - name: Install NDK 27.1.12297006 and CMake 3.31.6
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.1.12297006" \
            "cmake;3.31.6" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Cache native build output
        uses: actions/cache@v4
        with:
          path: |
            android/app/.cxx
            ~/.gradle/caches/transforms-*
          key: ndk-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'package-lock.json') }}

      - name: Build APK
        working-directory: android
        run: |
          TASK=$([ "${{ inputs.build_type }}" = "debug" ] && echo assembleDebug || echo assembleRelease)
          ./gradlew $TASK \
            -PreactNativeArchitectures=${{ inputs.architectures }} \
            --no-daemon --stacktrace

      - name: Name the artifact
        id: meta
        run: |
          NAME="exchangapay-${{ inputs.build_type }}-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          echo "artifact_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
