/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. Date.toLocaleString and String.localeCompare that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Release signing credentials.
 *
 * Release builds MUST NOT be signed with the debug keystore. The debug key is the
 * React Native template's own keystore (SHA1 5E:8F:16:...:F6:25, password "android")
 * — it is public, identical in every RN project on GitHub, so anyone could sign a
 * trojanised build that Android would accept as a legitimate update over this app.
 *
 * Credentials are resolved from the environment (CI) or Gradle properties
 * (~/.gradle/gradle.properties for local release builds) — never from this repo:
 *
 *   EXCHANGA_KEYSTORE_PATH      absolute path to the .jks materialised at build time
 *   EXCHANGA_KEYSTORE_PASSWORD  keystore passphrase
 *   EXCHANGA_KEY_ALIAS          key alias inside the keystore
 *   EXCHANGA_KEY_PASSWORD       key passphrase
 *
 * If they are absent the release build fails loudly rather than silently falling
 * back to the debug key. Pass -PallowUnsignedRelease=true to emit an unsigned APK
 * on purpose (e.g. for analysis); it will not install as an update.
 */
def resolveSigningSecret = { String name ->
    def value = System.getenv(name) ?: project.findProperty(name)
    return value?.toString()?.trim() ?: null
}

def releaseKeystorePath = resolveSigningSecret("EXCHANGA_KEYSTORE_PATH")
def releaseKeystorePassword = resolveSigningSecret("EXCHANGA_KEYSTORE_PASSWORD")
def releaseKeyAlias = resolveSigningSecret("EXCHANGA_KEY_ALIAS")
def releaseKeyPassword = resolveSigningSecret("EXCHANGA_KEY_PASSWORD")

def releaseKeystoreFile = releaseKeystorePath ? file(releaseKeystorePath) : null
// Note: explicit null check rather than `?.exists()` — Gradle instruments File.exists()
// with a non-null receiver contract, so safe navigation throws instead of returning null.
def releaseKeystoreExists = releaseKeystoreFile != null && releaseKeystoreFile.exists()
def hasReleaseSigning = releaseKeystoreExists && releaseKeystorePassword &&
        releaseKeyAlias && releaseKeyPassword

// Fail only when a release artefact is actually requested, so debug builds and
// IDE syncs on machines without the signing secrets are unaffected.
if (!hasReleaseSigning && !project.hasProperty("allowUnsignedRelease")) {
    gradle.taskGraph.whenReady { graph ->
        def releaseTask = graph.allTasks.find {
            it.project == project && it.name ==~ /(?i)(assemble|bundle|install|package).*Release/
        }
        if (releaseTask) {
            throw new GradleException(
                "Release signing is not configured, and signing a release with the debug " +
                "keystore is forbidden (see security finding C-03).\n" +
                (releaseKeystorePath && !releaseKeystoreExists
                    ? "  EXCHANGA_KEYSTORE_PATH points at a file that does not exist: ${releaseKeystorePath}\n"
                    : "") +
                "Set EXCHANGA_KEYSTORE_PATH, EXCHANGA_KEYSTORE_PASSWORD, EXCHANGA_KEY_ALIAS and " +
                "EXCHANGA_KEY_PASSWORD (environment variables in CI, or ~/.gradle/gradle.properties " +
                "locally).\nTo build an intentionally unsigned release, pass -PallowUnsignedRelease=true."
            )
        }
    }
}

/**
 * H-02 regression guard.
 *
 * res/xml/network_security_config.xml is inert unless the <application> tag
 * actually references it. That omission is silent: the build succeeds, the app
 * runs, and Android quietly falls back to its default policy, which trusts
 * user-installed CAs — exactly what the config exists to prevent. The file sat
 * unreferenced in this repo until the finding was raised.
 *
 * Assert on the source manifest that (a) the attribute is present and (b) the
 * release policy still blocks cleartext and omits user trust anchors. Checked
 * only when a release artefact is requested, matching the signing guard above.
 */
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find {
        it.project == project && it.name ==~ /(?i)(assemble|bundle|install|package).*Release/
    }
    if (!releaseTask) return

    def manifest = file("src/main/AndroidManifest.xml").text
    if (!(manifest =~ /android:networkSecurityConfig\s*=\s*"@xml\/network_security_config"/)) {
        throw new GradleException(
            "src/main/AndroidManifest.xml does not set android:networkSecurityConfig on " +
            "<application> (security finding H-02).\nWithout it Android ignores " +
            "res/xml/network_security_config.xml and trusts user-installed CAs, making " +
            "traffic interception straightforward.\nRestore:\n" +
            "  android:networkSecurityConfig=\"@xml/network_security_config\""
        )
    }

    def nsc = file("src/main/res/xml/network_security_config.xml").text
    if (!(nsc =~ /cleartextTrafficPermitted\s*=\s*"false"/)) {
        throw new GradleException(
            "src/main/res/xml/network_security_config.xml no longer sets " +
            "cleartextTrafficPermitted=\"false\" (security finding H-02)."
        )
    }
    if (nsc =~ /<certificates\s+src\s*=\s*"user"/) {
        throw new GradleException(
            "src/main/res/xml/network_security_config.xml trusts user-installed " +
            "certificates (security finding H-02).\nThat defeats the control: any CA a " +
            "user or malicious profile installs can then intercept traffic.\nUser trust " +
            "belongs only in src/debug/res/xml/network_security_config.xml."
        )
    }

    // H-03: certificate pinning must be present, carry a backup pin, and not have
    // silently lapsed. Android treats an expired pin-set as "no pinning" without any
    // build or runtime warning, so the expiry is checked here instead.
    def pins = (nsc =~ /<pin\s+digest\s*=\s*"SHA-256"\s*>([^<]+)<\/pin>/).collect { it[1].trim() }
    if (pins.size() < 2) {
        throw new GradleException(
            "src/main/res/xml/network_security_config.xml declares ${pins.size()} " +
            "certificate pin(s); at least 2 are required (security finding H-03).\n" +
            "A single pin means the next certificate reissue bricks every installed app " +
            "with no remote recovery. Keep a backup pin for a CA in the chain."
        )
    }
    def expiryMatch = (nsc =~ /<pin-set\s+expiration\s*=\s*"(\d{4}-\d{2}-\d{2})"/)
    if (!expiryMatch) {
        throw new GradleException(
            "<pin-set> has no expiration attribute (security finding H-03).\nWithout one " +
            "a stale pin bricks the app permanently instead of degrading to normal " +
            "certificate validation."
        )
    }
    def expiry = java.time.LocalDate.parse(expiryMatch[0][1])
    if (!expiry.isAfter(java.time.LocalDate.now())) {
        throw new GradleException(
            "Certificate pin-set expired on ${expiry} (security finding H-03).\nAndroid " +
            "stops enforcing pinning past this date, silently. Re-verify the pins against " +
            "the live chain and extend the date:\n" +
            "  openssl s_client -servername api.exchangapay.com -connect api.exchangapay.com:443 \\\n" +
            "    -showcerts </dev/null | openssl x509 -pubkey -noout \\\n" +
            "    | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary | openssl enc -base64"
        )
    }

    // M-03: the XML attribute above and security/pinning-policy.json must agree.
    //
    // An XML attribute cannot import JSON, so the date is necessarily written
    // twice. What is avoidable is the two copies disagreeing without anyone
    // noticing — and a disagreement here is invisible by construction, because
    // whichever copy is stale still looks like a perfectly valid date. So the
    // build asserts equality rather than trusting that both were updated.
    //
    // A missing or unreadable policy fails the build. A guard that silently
    // skips when it cannot find its input is worse than no guard: it reports
    // success either way.
    def repoRoot = file("${rootProject.projectDir}/..")
    def pinPolicyFile = new File(repoRoot, "security/pinning-policy.json")
    if (!pinPolicyFile.exists()) {
        throw new GradleException(
            "security/pinning-policy.json is missing (security finding M-03).\nIt is the " +
            "single source of truth for pin-set expiry; the Android pin-set cannot be " +
            "checked against it."
        )
    }
    def pinPolicyText = pinPolicyFile.text
    def policyExpiryMatch = (pinPolicyText =~ /"androidExpiration"\s*:\s*"(\d{4}-\d{2}-\d{2})"/)
    if (!policyExpiryMatch) {
        throw new GradleException(
            "security/pinning-policy.json has no pinSet.androidExpiration (security finding M-03).\n" +
            "It is the source of truth for the <pin-set expiration> attribute in\n" +
            "src/main/res/xml/network_security_config.xml."
        )
    }
    def policyExpiry = java.time.LocalDate.parse(policyExpiryMatch[0][1])
    if (policyExpiry != expiry) {
        throw new GradleException(
            "Pin-set expiry drift (security finding M-03):\n" +
            "  src/main/res/xml/network_security_config.xml  <pin-set expiration=\"${expiry}\">\n" +
            "  security/pinning-policy.json                  androidExpiration = \"${policyExpiry}\"\n" +
            "These must be identical. security/pinning-policy.json is the source of truth —\n" +
            "change it there, then copy the value into the XML attribute."
        )
    }

    // M-03: warn while the date can still be moved.
    //
    // The check above fails the build only once the pin-set has ALREADY lapsed,
    // by which point every install in the field is running unpinned and the fix
    // needs a release. This warns during the run-up instead, so the renewal is
    // scheduled work rather than an incident.
    def buildWarnMatch = (pinPolicyText =~ /"buildWarnWithinDays"\s*:\s*(\d+)/)
    def buildWarnDays = buildWarnMatch ? (buildWarnMatch[0][1] as long) : 90L
    def daysToExpiry = java.time.temporal.ChronoUnit.DAYS.between(java.time.LocalDate.now(), expiry)
    if (daysToExpiry <= buildWarnDays) {
        logger.warn(
            "warning: [M-03] Android certificate pin-set expires on ${expiry} (${daysToExpiry} days).\n" +
            "  Android fails OPEN at that date: pinning silently stops being enforced on every\n" +
            "  installed app, with no build error and no runtime symptom. Re-verify the SPKI\n" +
            "  hashes with ./scripts/compute-spki-pins.sh, then extend androidExpiration in\n" +
            "  security/pinning-policy.json and the matching attribute in\n" +
            "  src/main/res/xml/network_security_config.xml."
        )
    }

    // ---------------------------------------------------------------------
    // H-02: pinning COVERAGE, as opposed to pinning construction.
    //
    // The pin-set above is well built and covered 2 of the 8 hosts the app
    // talks to. The other six were hardcoded in src/utils/api.tsx, so whoever
    // wrote the pin-set never saw them — the gap was invisible from inside the
    // file that was supposed to close it.
    //
    // The rule below removes "invisible" as an option. Every host the app is
    // configured to reach must be pinned or carry a written exemption. Adding a
    // host is now a decision someone has to record, not something that happens
    // by typing a URL.
    // ---------------------------------------------------------------------
    // repoRoot and the policy file are resolved by the M-03 block above.
    def policyFile = pinPolicyFile
    if (!policyFile.exists()) {
        throw new GradleException(
            "security/pinning-policy.json is missing (security finding H-02).\nIt is the " +
            "record of which hosts are deliberately unpinned and why. Without it an " +
            "omission and a decision look the same again."
        )
    }
    def policy = new groovy.json.JsonSlurper().parse(policyFile)
    def exemptions = policy.exemptions.collectEntries { [(it.host.toLowerCase()), it] }

    // The inventory: hosts named in the .env files, plus any baseURL literal in src/.
    def inventory = [:] as LinkedHashMap
    def recordHost = { String host, String source ->
        def key = host.toLowerCase()
        inventory[key] = (inventory[key] ?: []) + source
    }

    // Scan all committed .env.* files (dev, tst) for URL values.
    // .env.prod is gitignored but if present locally it is also scanned.
    new File(repoRoot.toString()).listFiles()
        .findAll { it.isFile() && it.name ==~ /\.env(\.\w+)?$/ && it.name != '.env.example' }
        .sort { it.name }
        .each { envFile ->
            envFile.eachLine { line ->
                def trimmed = line.trim()
                if (!trimmed || trimmed.startsWith('#')) return
                def m = (trimmed =~ /=\s*https?:\/\/([^\/\s]+)/)
                if (m) recordHost(m[0][1], envFile.name)
            }
        }

    new File(repoRoot, "src").eachFileRecurse { f ->
        if (f.isFile() && f.name ==~ /.*\.(ts|tsx|js|jsx)/) {
            (f.text =~ /baseURL\s*:\s*["'`]\s*https?:\/\/([^\/"'`\s]+)/).each { m ->
                recordHost(m[1], "src literal in ${f.name}")
            }
        }
    }

    def pinnedDomains = (nsc =~ /<domain[^>]*>([^<]+)<\/domain>/)
        .collect { it[1].trim().toLowerCase() }

    def uncovered = inventory.keySet().findAll {
        !pinnedDomains.contains(it) && !exemptions.containsKey(it)
    }
    if (uncovered) {
        throw new GradleException(
            "These hosts are neither pinned nor exempt (security finding H-02):\n" +
            uncovered.collect { "  ${it}  <- ${inventory[it].unique().join(', ')}" }.join("\n") +
            "\n\nPin them, or record why not.\n" +
            "  ./scripts/compute-spki-pins.sh      prints the chain and SPKI hashes\n" +
            "  network_security_config.xml         add a <domain-config> with 2 pins\n" +
            "  ios/exchangapay/Info.plist          add the matching NSPinnedDomains entry\n" +
            "  security/pinning-policy.json        or add an exemption with a reason"
        )
    }

    // An exemption with no reason, or one nobody has looked at in a year, is the
    // omission this guard exists to prevent — wearing a label.
    def today = java.time.LocalDate.now()
    exemptions.each { host, entry ->
        if (!entry.reason?.trim()) {
            throw new GradleException(
                "The pinning exemption for ${host} has no reason (security finding H-02).\n" +
                "An explicit exemption is a control; a blank one is an omission with a name."
            )
        }
        if (!entry.reviewBy) {
            throw new GradleException(
                "The pinning exemption for ${host} has no reviewBy date (security finding H-02)."
            )
        }
        if (!java.time.LocalDate.parse(entry.reviewBy as String).isAfter(today)) {
            throw new GradleException(
                "The pinning exemption for ${host} was due for review on ${entry.reviewBy} " +
                "(security finding H-02).\nRe-check whether it can be pinned now — the " +
                "remediation on file is:\n  ${entry.remediation}\nThen extend the date."
            )
        }
    }

    // Android and iOS must pin the same hosts. The finding measured the gap as
    // materially larger on iOS, and nothing in either file would have said so.
    def plistFile = new File(repoRoot, "ios/exchangapay/Info.plist")
    if (plistFile.exists()) {
        // Hostname-shaped <key> entries in Info.plist only ever occur inside
        // NSPinnedDomains — no other Info.plist key contains a dotted label.
        def iosPinned = (plistFile.text =~ /<key>([a-z0-9][a-z0-9.\-]*\.[a-z]{2,})<\/key>/)
            .collect { it[1].toLowerCase() } as Set
        def androidOnly = pinnedDomains.findAll { !iosPinned.contains(it) }
        def iosOnly = iosPinned.findAll { !pinnedDomains.contains(it) }
        if (androidOnly || iosOnly) {
            throw new GradleException(
                "The Android and iOS pin-sets name different hosts (security finding H-02):\n" +
                (androidOnly ? "  pinned on Android only: ${androidOnly.join(', ')}\n" : "") +
                (iosOnly ? "  pinned on iOS only: ${iosOnly.join(', ')}\n" : "") +
                "\nUnpinned hosts are materially more exposed on iOS: ATS honours " +
                "user-installed certificates, so a configuration profile the user was " +
                "talked into installing is enough to intercept them. Android's " +
                "<base-config> trusts system anchors only. Keep the two files in step."
            )
        }
    }
}

/**
 * C-01 regression guard — production build must not ship test-tenant native config.
 *
 * Reads the .env file at the repo root (the same file react-native-config uses)
 * and fails a production release if any value is still pointing at test.
 */
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find {
        it.project == project && it.name ==~ /(?i)(assemble|bundle|install|package).*Release/
    }
    if (!releaseTask) return

    def appId = android.defaultConfig.applicationId?.toString()
    def productionIds = ["com.exchangapay"] as Set
    if (!productionIds.contains(appId)) return

    def repoRoot = file("${rootProject.projectDir}/..")

    // Parse the .env file into a map
    def envFile = new File(repoRoot, ".env")
    if (!envFile.exists()) {
        throw new GradleException("[C-01] No .env file found at repo root. Run: npm run env:prod")
    }
    def envVars = [:]
    envFile.eachLine { line ->
        def trimmed = line.trim()
        if (trimmed && !trimmed.startsWith('#')) {
            def idx = trimmed.indexOf('=')
            if (idx > 0) envVars[trimmed.substring(0, idx).trim()] = trimmed.substring(idx + 1).trim()
        }
    }

    // 1. APP_ENV must be prod
    if (envVars['APP_ENV'] != 'prod') {
        throw new GradleException(
            "[C-01] Production applicationId '${appId}' but .env has APP_ENV='${envVars['APP_ENV']}'.\n" +
            "Run: npm run env:prod"
        )
    }

    // 2. AUTH_URL must not be the test host or the unfilled placeholder
    def authUrl = envVars['AUTH_URL'] ?: ''
    if (authUrl.contains('tstlogin.suissebase.io') || authUrl.contains('REPLACE_WITH_PROD_AUTH_HOST')) {
        throw new GradleException(
            "[C-01] .env AUTH_URL is not set to a production host: '${authUrl}'.\n" +
            "Set AUTH_URL to the real production auth host in .env.prod."
        )
    }

    // 3. iOS APNs entitlement must be production
    def entitlementsFile = new File(repoRoot, "ios/exchangapay/exchangapay.entitlements")
    if (entitlementsFile.exists() && entitlementsFile.text =~ /<string>development<\/string>/) {
        throw new GradleException(
            "[C-01] ios/exchangapay/exchangapay.entitlements has aps-environment=development.\n" +
            "Ensure Xcode uses exchangapay-release.entitlements for Release builds."
        )
    }

    logger.lifecycle("[C-01] Production release config checks passed for '${appId}'.")
}

/**
 * M-08 regression guard — legacy crypto formats must be removed by their deadline.
 *
 * LEGACY_FORMATS_ENABLED = true keeps two pre-0x01 CBC formats readable,
 * including the all-zero-IV form that leaks equality between records. The removal
 * date is 2026-11-01. Past that date, leaving the flag on is no longer a
 * deliberate migration trade — it is a missed deadline. This guard converts the
 * telemetry escalation in legacyTelemetry.ts into a hard build failure so the
 * decision cannot be quietly deferred past the date the team agreed on.
 *
 * To extend the deadline: update LEGACY_FORMAT_REMOVAL_DATE in policy.ts,
 * update the risk register entry in security/RISK_REGISTER.md, and record why.
 */
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find {
        it.project == project && it.name ==~ /(?i)(assemble|bundle|install|package).*Release/
    }
    if (!releaseTask) return

    def policyFile = new File("${rootProject.projectDir}/../src/utils/crypto/policy.ts")
    if (!policyFile.exists()) return

    def policySource = policyFile.text
    def legacyEnabled = (policySource =~ /LEGACY_FORMATS_ENABLED\s*=\s*(true|false)/)
    def removalDateMatch = (policySource =~ /LEGACY_FORMAT_REMOVAL_DATE\s*=\s*["']([\d-]+)["']/)

    if (!legacyEnabled || !removalDateMatch) return

    if (legacyEnabled[0][1] == "true") {
        def removalDate = java.time.LocalDate.parse(removalDateMatch[0][1])
        if (!java.time.LocalDate.now().isBefore(removalDate)) {
            throw new GradleException(
                "[M-08] LEGACY_FORMATS_ENABLED is still true past the agreed removal date " +
                "(${removalDate}).\n" +
                "The zero-IV CBC fallback is an accepted deviation from strict AEAD — see " +
                "security/RISK_REGISTER.md — but the acceptance was time-bounded.\n" +
                "Check the crypto.legacy_format metric in Sentry. If it has been zero for " +
                "a full release cycle, set LEGACY_FORMATS_ENABLED = false in " +
                "src/utils/crypto/policy.ts and ship. If legacy records are still present, " +
                "extend LEGACY_FORMAT_REMOVAL_DATE and update the risk register with a reason."
            )
        }
    }
}

/**
 * H-13 regression guard — the JS tenant and the native Auth0 callback must match.
 *
 * Both are now driven by the same .env file, so a mismatch is only possible if
 * someone edits build.gradle manually. This guard makes that visible at build time.
 */
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find {
        it.project == project && it.name ==~ /(?i)(assemble|bundle|install|package).*Release/
    }
    if (!releaseTask) return

    def jsDomain   = System.getenv("AUTH0_ISSUER") ?: project.findProperty("AUTH0_ISSUER") ?: ""
    def nativeDomain = android.defaultConfig.manifestPlaceholders["auth0Domain"]?.toString() ?: ""

    if (jsDomain && nativeDomain && jsDomain != nativeDomain) {
        throw new GradleException(
            "[H-13] Auth0 domain mismatch: .env AUTH0_ISSUER='${jsDomain}' but " +
            "manifestPlaceholders auth0Domain='${nativeDomain}'.\n" +
            "Both are read from .env — check that ANDROID_AUTH0_DOMAIN and AUTH0_ISSUER " +
            "name the same tenant."
        )
    }
    if (jsDomain) logger.lifecycle("[H-13] Auth0 tenant '${jsDomain}' consistent between JS and native.")

    // M-07: the legacy custom-scheme callback has a review date.
    //
    // The App Link filter in AndroidManifest.xml cannot replace the custom scheme
    // until it actually verifies on installed devices AND the install base has
    // turned over — users on older builds still depend on the scheme, and an
    // update cannot reach someone who has not taken it. So the scheme has to
    // outlive the migration, and "temporary" quietly becomes permanent.
    //
    // A date in a comment is not tracking; nobody rereads a comment. This puts it
    // in a build log. It is a WARNING and never a failure: the custom scheme
    // working is the only thing keeping login alive on old installs, so a build
    // that refused to ship it would cause the exact outage it is meant to avoid.
    def legacyCallbackReviewDate = java.time.LocalDate.parse("2027-02-06")
    def manifestText = file("src/main/AndroidManifest.xml").text
    def legacySchemePresent = manifestText =~ /android:scheme="\$\{auth0Scheme\}"/
    if (legacySchemePresent && !java.time.LocalDate.now().isBefore(legacyCallbackReviewDate)) {
        def daysOver = java.time.temporal.ChronoUnit.DAYS.between(
            legacyCallbackReviewDate, java.time.LocalDate.now())
        logger.warn(
            "[M-07] The legacy custom-scheme OAuth callback is still shipping, ${daysOver} day(s) past\n" +
            "  its ${legacyCallbackReviewDate} review date. Any app on the device can register\n" +
            "  '\${applicationId}.auth0://callback' and receive the authorization code.\n" +
            "  Either confirm the removal criteria in security/M07_APPLINKS_SETUP.md and delete the\n" +
            "  legacy <intent-filter>, or record why not and move the date in that file, this guard\n" +
            "  and AndroidManifest.xml together."
        )
    }
}

/**
 * M-06 permission-footprint guard.
 *
 * The audit read AndroidManifest.xml and found microphone and broad storage
 * access. The manifest was the wrong file to be sure with: it lists what the app
 * asks for, while the APK ships the MERGED manifest, which is that plus whatever
 * every AAR declares. In this project that difference is most of the list —
 * Sumsub contributes microphone, both location permissions and WRITE_SETTINGS,
 * and ShortcutBadger contributes eighteen launcher badge permissions, none of
 * which appear anywhere in this repository.
 *
 * So this guard reads the merged manifest, after the merge, and holds it against
 * security/android-permissions.json, where every permission has a reason and a
 * runtime request path. Two ways to fail:
 *
 *   1. A permission is in the APK that the policy does not list. This is the
 *      `npm install` case — a new dependency widens the footprint and nobody
 *      notices until an audit.
 *   2. A permission the policy records as removed is back. tools:node="remove"
 *      is silent when it stops working: rename the permission, change merge
 *      order, and the entry is simply ignored. This is how the microphone would
 *      return without anyone editing a manifest.
 *
 * Release builds only, in keeping with the other guards in this file. If the
 * merged manifest cannot be located the guard warns rather than fails — a
 * changed AGP output layout should not be able to block a release.
 */
tasks.matching { it.name ==~ /(?i)process.*ReleaseMainManifest/ }.configureEach { manifestTask ->
    manifestTask.doLast {
        def policyFile = new File("${rootProject.projectDir}/../security/android-permissions.json")
        if (!policyFile.exists()) {
            throw new GradleException(
                "security/android-permissions.json is missing (security finding M-06).\n" +
                "It is the record of which permissions the APK ships and why. Without it, " +
                "a permission that arrived with a dependency and a permission someone chose " +
                "look exactly the same."
            )
        }
        def policy = new groovy.json.JsonSlurper().parse(policyFile)

        // Locate the merged manifest through the task's own outputs rather than a
        // hardcoded intermediates path, which moves between AGP versions.
        def candidates = []
        manifestTask.outputs.files.each { f ->
            if (f.isDirectory()) {
                candidates.addAll(fileTree(dir: f, include: "**/AndroidManifest.xml").files)
            } else if (f.name == "AndroidManifest.xml") {
                candidates << f
            }
        }
        def merged = candidates.find { it.exists() && it.text.contains("<manifest") }
        if (!merged) {
            logger.warn(
                "[M-06] could not locate the merged manifest among the outputs of " +
                "${manifestTask.name}; skipping the permission-footprint check. " +
                "The policy in security/android-permissions.json was NOT verified for this build."
            )
            return
        }

        def appId = android.defaultConfig.applicationId?.toString() ?: ""
        def declared = (merged.text =~ /<uses-permission(?:-sdk-23)?[^>]*android:name="([^"]+)"/)
            .collect { it[1] }
            .collect { appId && it.startsWith("${appId}.") ? '${applicationId}' + it.substring(appId.length()) : it }
            .unique()

        def documented = policy.permissions.collect { it.name } as Set
        def removed = policy.removed.collectEntries { [(it.name), it] }
        def patterns = policy.patterns.collect { [regex: ~(it.match as String), entry: it] }

        // 1. Undocumented — in the APK, not in the policy.
        def undocumented = declared.findAll { name ->
            !documented.contains(name) && !patterns.any { name ==~ it.regex }
        }
        if (undocumented) {
            throw new GradleException(
                "These permissions ship in the APK but are not documented (security finding M-06):\n" +
                undocumented.collect { "  ${it}" }.join("\n") +
                "\n\nThey are in the MERGED manifest, so they may come from a dependency rather " +
                "than from android/app/src/main/AndroidManifest.xml. To find the source:\n" +
                "  app/build/outputs/logs/manifest-merger-release-report.txt\n\n" +
                "Then either remove it with tools:node=\"remove\" in the app manifest and add it to\n" +
                "the \"removed\" list, or add an entry to security/android-permissions.json giving\n" +
                "its purpose and the code path that requests it at run time."
            )
        }

        // 2. Resurrected — the policy says removed, the APK says otherwise.
        def resurrected = declared.findAll { removed.containsKey(it) }
        if (resurrected) {
            throw new GradleException(
                "These permissions are recorded as removed but are back in the APK " +
                "(security finding M-06):\n" +
                resurrected.collect { "  ${it}  <- ${removed[it].why}" }.join("\n") +
                "\n\nA tools:node=\"remove\" entry in the app manifest has stopped taking effect, " +
                "or a new dependency declares the permission in a way the removal does not cover.\n" +
                "If the permission is now genuinely needed, move its entry from \"removed\" to " +
                "\"permissions\" in security/android-permissions.json and record what requests it."
            )
        }

        // 3. An entry with no reason is the omission this guard exists to prevent,
        //    wearing a label. Same rule the H-02 pinning exemptions are held to.
        (policy.permissions + policy.removed).each { entry ->
            if (!entry.why?.trim()) {
                throw new GradleException(
                    "The permission policy entry for ${entry.name} has no 'why' " +
                    "(security finding M-06)."
                )
            }
        }
        policy.permissions.each { entry ->
            if (!entry.runtimeRequest?.trim()) {
                throw new GradleException(
                    "The permission policy entry for ${entry.name} does not say where it is " +
                    "requested at run time (security finding M-06). Write 'none' and why, if it " +
                    "is a normal permission that needs no request."
                )
            }
        }

        // 4. Soft signals: a stale inventory and an overdue review are worth saying
        //    out loud, but neither is a reason to block a release.
        def missing = documented.findAll { name ->
            !name.startsWith('${') && !declared.contains(name)
        }
        if (missing) {
            logger.warn(
                "[M-06] the policy documents permissions that are no longer in the APK: " +
                "${missing.join(', ')}. Remove the stale entries so the inventory stays readable."
            )
        }
        if (policy.reviewBy && !java.time.LocalDate.parse(policy.reviewBy as String).isAfter(java.time.LocalDate.now())) {
            logger.warn(
                "[M-06] security/android-permissions.json was due for review on ${policy.reviewBy}. " +
                "Re-check each entry against the features that actually shipped, then extend the date."
            )
        }

        logger.lifecycle("[M-06] permission footprint verified: ${declared.size()} permissions, all documented.")
    }
}

apply from: new File(["node", "--print", "require.resolve('@sentry/react-native/package.json')"].execute().text.trim(), "../sentry.gradle")
android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // AGP 8.12 defaults to CMake 3.22.1, which emits `-fuse-ld=gold`. NDK 27 ships
    // Clang 18, which removed the gold linker, so configure fails with
    // "invalid linker name in argument '-fuse-ld=gold'". 3.31.6 uses lld instead.
    externalNativeBuild {
        cmake {
            version "3.31.6"
        }
    }

    // namespace must be a literal string — the RN CLI parses it with a regex
    // and cannot evaluate Groovy variables. It is the Java package name only;
    // applicationId (the Play Store / device identity) is driven by .env below.
    namespace "com.exchangapay.tst"

    // Read per-environment values from the .env file loaded by react-native-config.
    // Fallback to test values so IDE syncs and debug builds work without a .env file.
    def appId       = (project.hasProperty('env') ? project.env.get('ANDROID_APPLICATION_ID', null) : null)
                      ?: System.getenv("ANDROID_APPLICATION_ID")
                      ?: "com.exchangapay.tst"
    def auth0Domain = (project.hasProperty('env') ? project.env.get('ANDROID_AUTH0_DOMAIN', null) : null)
                      ?: System.getenv("ANDROID_AUTH0_DOMAIN")
                      ?: "exchangapay-tst.eu.auth0.com"

    defaultConfig {
        applicationId appId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [auth0Domain: auth0Domain, auth0Scheme: "${applicationId}.auth0"]
    }
    signingConfigs {
        debug {
            // Debug builds only. Uses the project-local debug.keystore when a developer
            // still has one, otherwise falls back to AGP's ~/.android/debug.keystore,
            // which is generated automatically on first build — so this keeps working
            // after debug.keystore is removed from the repository.
            if (file('debug.keystore').exists()) {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                // v1 (JAR) signatures are forgeable via Janus on API < 24; minSdk is
                // well above that, so sign with the v2/v3 APK Signature Schemes only.
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Signed with the dedicated release key resolved above. Never the debug key:
            // when signing is unconfigured this is null (unsigned output) and the guard
            // near the top of this file aborts the build instead.
            signingConfig hasReleaseSigning ? signingConfigs.release : null
            // C-08: R8 shrinking + obfuscation. The -optimize base file is required
            // for the -assumenosideeffects Log stripping in proguard-rules.pro to
            // take effect; plain proguard-android.txt disables optimisation and
            // silently ignores it. If regression testing surfaces R8-induced
            // crashes, dropping back to proguard-android.txt is the safer dial.
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // H-04: Play Integrity. Produces a Google-signed verdict about the device and
    // the app binary that the BACKEND verifies — the only check here an attacker
    // with root cannot patch out, because it is not computed in this process.
    // See PlayIntegrityModule.kt and src/security/attestation.ts.
    implementation("com.google.android.play:integrity:1.4.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}