buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        // Intentionally held at 35: targetSdk 36 makes edge-to-edge mandatory on
        // Android 16 and ignores the edgeToEdgeEnabled=false opt-out.
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        // AGP 8.12 defaults to CMake 3.22.1, which emits `-fuse-ld=gold`. NDK 27 ships
        // Clang 18, which removed the gold linker, so every C++ configure fails with
        // "invalid linker name in argument '-fuse-ld=gold'". 3.31.6 uses lld instead.
        // Install with: sdkmanager "cmake;3.31.6"
        cmakeVersion = "3.31.6"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath('com.google.gms:google-services:4.4.4')
        classpath('com.google.firebase:firebase-crashlytics-gradle:3.0.6')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        
    }
}
allprojects {
  repositories {
      google()
      mavenCentral()
      maven { url "https://maven.sumsub.com/repository/maven-public/" }
      maven { url "https://www.jitpack.io" }
  }
}

// Force every native module onto one CMake and one NDK. Without this, library
// modules (e.g. @sentry/react-native) fall back to AGP's default CMake 3.22.1 and
// whatever NDK they declare themselves, which breaks against NDK 27 / Clang 18.
subprojects { subproject ->
    afterEvaluate {
        if (subproject.hasProperty("android")) {
            subproject.android {
                ndkVersion rootProject.ext.ndkVersion
                externalNativeBuild {
                    cmake {
                        version rootProject.ext.cmakeVersion
                    }
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"