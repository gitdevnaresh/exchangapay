# Sentry CLI configuration for the iOS build (source maps / debug symbols).
#
# NO SECRETS IN THIS FILE. The org, project and URL below are not sensitive and
# are kept versioned so a fresh clone builds without any local setup.
#
# The auth token is deliberately NOT stored here. sentry-cli reads it from the
# environment natively, so provide it at build time instead:
#
#   local dev :  export SENTRY_AUTH_TOKEN=sntrys_...   (or put it in ~/.sentryclirc)
#   CI        :  SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
#
# The token should be an organisation token scoped to project:releases only.
# Without SENTRY_AUTH_TOKEN set, sentry-cli skips the upload and the build still
# succeeds — crash reports keep working, they are just not symbolicated.

defaults.org=exchangapay
defaults.project=exchangapay

defaults.url=https://sentry.io/
